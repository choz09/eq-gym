<style>
:root{
  color-scheme:dark;
  --bg:#010102; --surface:#0f1011; --surface2:#18191a; --line:#23252a; --text:#e9eef2; --dim:#a3adbb; --faint:#4b5565;
  --accent:#c6f432; --accent-ink:#141b02; --btn:#c6f432; --btn-ink:#141b02;
  --sel:#e9eef2; --sel-ink:#0b0c0e;
  --g-s:#a0f7e6; --g-a:#25d4b8; --g-b:#b58cff; --g-c:#ffa0d0; --g-d:#e8103c;
  --win:#ffb02e; --tie:#d9d9df; --lose:#5b7cff;
  --suit-s:#dfe1e8; --suit-h:#ff6b6b; --suit-d:#6ea8ff; --suit-c:#5fe08a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:480px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:18px;margin:4px 0 14px;font-weight:700;letter-spacing:.02em}
h2{font-size:14px;margin:24px 0 12px;color:var(--dim);font-weight:600}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.wm{font-family:"Archivo","Arial Black","Segoe UI Black",system-ui,sans-serif;font-weight:900;font-style:italic;font-size:28px;line-height:1;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.wm b{color:var(--accent);font-weight:900}
.tabs{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:10px 20px;min-height:40px;border-radius:8px;font-size:14px;color:var(--dim);font-weight:700}
.tabs button.on{background:var(--sel);color:var(--sel-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.dim{color:var(--dim)}
.small{font-size:13px}
.chip{border:0;background:var(--surface2);color:var(--dim);padding:10px 14px;min-height:40px;border-radius:999px;font-size:13px}
.chip.on{background:transparent;color:var(--sel);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--sel)}
.btn{border:0;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:16px;padding:14px 16px;border-radius:8px;width:100%}
.btn.ghost{background:var(--surface2);color:var(--text);font-weight:600}
.btn.sm{width:auto;font-size:13px;padding:10px 14px;min-height:40px;border-radius:6px}
.btn:disabled{opacity:.45}
/* カード */
.pc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:54px;height:76px;border-radius:9px;background:#2a2c33;font-weight:700;line-height:1}
.pc b{font-size:28px}.pc i{font-style:normal;font-size:22px;margin-top:3px}
.pc.sm{width:40px;height:56px;border-radius:7px}.pc.sm b{font-size:21px}.pc.sm i{font-size:16px}
.s0{color:var(--suit-s)}.s1{color:var(--suit-h)}.s2{color:var(--suit-d)}.s3{color:var(--suit-c)}
.slot{display:inline-flex;align-items:center;justify-content:center;width:54px;height:76px;border-radius:9px;border:1.5px dashed var(--faint);background:none;color:var(--faint);font-size:24px}
.slot.sm{width:40px;height:56px;font-size:18px}
.cards{display:flex;gap:6px}
/* 13x13 */
.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:1px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.grid.ro{touch-action:auto}
.gwrap{display:grid;grid-template-columns:16px 1fr;gap:1px}
.ghead{display:grid;gap:1px}
.ghead.gtop{grid-template-columns:repeat(13,1fr)}
.ghead.gleft{grid-template-rows:repeat(13,1fr)}
.gh{border:0;background:none;color:var(--dim);font-size:11px;font-weight:700;padding:0;min-height:18px}
.gh{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gh.hold{color:var(--sel);background:var(--surface2);border-radius:3px}
.undo{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:12px;background:var(--surface2);color:var(--sel);border-radius:999px;padding:8px 8px 8px 16px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.6)}
.undo button{border:0;background:var(--sel);color:var(--sel-ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.loupe{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-100%);background:var(--sel);color:var(--sel-ink);border-radius:10px;padding:8px 14px;font-weight:800;font-size:20px;box-shadow:0 4px 18px rgba(0,0,0,.6);white-space:nowrap}
.loupe small{font-size:12px;font-weight:700;margin-right:6px;opacity:.7}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:#7a8595;font-size:9.5px;font-weight:600;border-radius:2px;overflow:hidden}
.cell.on{background:var(--sel);color:var(--sel-ink)}
.cell.hm{font-size:10.5px;font-weight:800}
.cell.out{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:#4a5058}
.cell.out.pair{box-shadow:inset 0 0 0 1px #3a3f48}
.legend2{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:8px}
.legend2+.bar{height:8px;border-radius:4px;margin-top:4px}
.cell.dead{opacity:.35}
.cell.focus{outline:2px solid #fff;outline-offset:-2px}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:8px}
.legend .bar{flex:1;height:8px;border-radius:4px}
/* 出題 */
.guess{font-size:52px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:2px 0}
.guess small{font-size:24px;color:var(--dim);margin-left:2px}
input[type=range]{width:100%;height:36px;accent-color:var(--sel);margin:0}
.step{flex:1;height:44px;border:0;border-radius:8px;background:var(--surface2);font-size:16px;font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:44px}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#2d3139}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--sel);border:0}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#2d3139}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--sel);border:0}
.result-top{text-align:center;padding:6px 0 2px}

.grade{display:inline-block;padding:5px 14px;border-radius:999px;font-weight:800;color:#0d0e10;font-size:15px}
.grade.d{color:#fff}
.big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--dim)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.gbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%}
.gl{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:6px 14px;font-size:12px;margin-top:8px;color:var(--dim)}
.gl i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
/* 電卓 */
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:10px 8px;min-height:40px;border-radius:6px;color:var(--dim);font-size:13px;font-weight:600}
.seg button.on{background:var(--surface);color:var(--sel);box-shadow:inset 0 0 0 1.5px var(--sel)}
input[type=text]{width:100%;background:var(--surface2);border:0;border-radius:10px;padding:11px 12px;color:var(--text);font:inherit;font-size:14px}
.bar2{height:22px;border-radius:6px;overflow:hidden;display:flex;background:var(--surface2)}
.bar2 div{height:100%}
.err{color:var(--g-d);font-size:12px;margin-top:4px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:10}
.sheet>div{background:var(--surface);width:100%;max-width:480px;margin:0 auto;border-radius:18px 18px 0 0;padding:14px 12px calc(16px + env(safe-area-inset-bottom))}
.pk{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin-bottom:6px}
.pk button{border:0;background:var(--surface2);border-radius:5px;padding:8px 0;font-size:14px;font-weight:700}
.pk button:disabled{opacity:.18}
.pk button.sel{outline:2px solid var(--sel)}
.spin{color:var(--dim);text-align:center;padding:18px 0}
.note{font-size:12px;color:var(--dim);line-height:1.6}
a{color:var(--sel)}
.arow{padding:8px 0}
.arow.faint{opacity:.75}
.abar{flex:1;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.abar div{height:100%}
.plot{position:relative;height:130px}
.plot>i{position:absolute;left:0;right:0;border-top:1px dashed var(--faint);pointer-events:none}
.plot>i em{position:absolute;right:0;top:-16px;font-style:normal;font-size:12px;color:var(--dim)}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:6px;padding-right:26px}
.tcol{flex:1;max-width:44px;height:100%;display:flex;align-items:flex-end}
.tbar{width:100%;border-radius:3px 3px 0 0}
.xl{display:flex;gap:6px;padding-right:26px;margin-top:6px}
.xl span{flex:1;max-width:44px;text-align:center;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.kpi{background:var(--surface2);border-radius:8px;padding:12px 16px}
.kpi.main{background:var(--bg);border:1px solid var(--line)}
.kl{font-size:12px;color:var(--dim)}
.kbig{font-size:64px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-size:.5em;color:var(--dim);margin-left:2px;font-weight:700}
.faintnote{color:#8a919c;margin-top:2px}
#go{scroll-margin-top:84px}
#calcres{scroll-margin-top:84px}
.foot{max-width:480px;margin:8px auto 32px;padding:0 max(16px,env(safe-area-inset-left,0px));font-size:12px;line-height:1.7;color:#8a919c}
.kbig small,.kn small{font-size:.4em;color:var(--dim);margin-left:2px;font-weight:700}
.kn{font-size:30px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.kpis3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sess{display:block;width:100%;text-align:left;border:0;color:var(--text);font:inherit}
.qrow{display:flex;align-items:center;gap:10px;padding:10px}
</style>
</head>
<body>
<header class="top"><div class="top-in"><span class="wm">EQ <b>GYM</b></span><small style="color:var(--faint);font-size:10px;margin-left:6px">v5</small>
<nav class="tabs">
  <button data-tab="quiz" class="on">出題</button>
  <button data-tab="calc">計算</button>
</nav></div></header>
<main id="app"></main>
<footer class="foot">プリフロップのエクイティはシミュレーションによる推定値です(誤差の目安を結果に表示)。記録・登録したレンジはこの端末内にのみ保存され、外部には送信されません。</footer>
<div id="sheet"></div>

<script src="engine.js"></script>
<script>
"use strict";
const { CELLS, RL, cardId, cardStr, cellOfCombo, parseRange, rangeCombos, topPercent, countCombos, computeEquity } = EQ;

// 強さ順(対ランダムのエクイティ順、2026-10-24にMCで算出)
EQ.setRankOrder("AA KK QQ JJ TT 99 88 AKs 77 AQs AJs AKo ATs AQo AJo KQs 66 KJs A9s ATo A8s KTs KQo A7s A9o KJo QJs 55 A5s K9s A6s A8o KTo QTs A7o A4s K8s A3s QJo A5o K9o A6o K7s Q9s JTs A2s QTo K6s A4o 44 K8o Q8s A3o K5s J9s K7o Q9o JTo K4s A2o K6o Q7s K3s J8s T9s Q6s Q8o 33 K5o K2s J9o Q5s K4o T8s J7s Q7o Q4s K3o T9o J8o Q6o Q3s 98s K2o J6s T7s Q5o Q2s 22 T8o J5s J7o T6s Q4o 97s J4s Q3o 87s 98o J3s T7o J6o 96s Q2o T5s J2s J5o 86s T4s T6o 97o J4o 95s 76s T3s 87o J3o T2s 85s 96o T5o J2o 94s 75s T4o 86o 93s 65s 95o 84s T3o 76o 92s 74s 85o T2o 54s 64s 83s 94o 75o 82s 93o 73s 65o 53s 63s 84o 92o 43s 74o 72s 54o 64o 62s 52s 83o 82o 42s 73o 53o 63o 32s 43o 72o 62o 52o 42o 32o".split(" "));

const $ = (s, el = document) => el.querySelector(s);
const SUITCH = ["♠", "♥", "♦", "♣"];
const cardHtml = (id, sm) => `<span class="pc ${sm ? "sm" : ""} s${id & 3}"><b>${EQ.RK[id >> 2]}</b><i>${SUITCH[id & 3]}</i></span>`;
const QUICK = [["Axs すべて", "A2s+"], ["ポケット すべて", "22+"], ["Axo すべて", "A2o+"], ["BWs", "ATs+,KTs+,QTs+,JTs"]];
const addRange = (sel, txt) => { const r = parseRange(txt).sel; r.forEach((v, i) => v && (sel[i] = 1)); };
const comboLabel = (n) => `${n} / 1326 (${((n / 1326) * 100).toFixed(1)}%)`;
const pct = (x, d = 1) => (x * 100).toFixed(d);
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- 採点 ----------
const GRADES = [
  { max: 1, key: "S", label: "ほぼ完璧", color: "var(--g-s)" },
  { max: 2.5, key: "A", label: "かなり近い", color: "var(--g-a)" },
  { max: 5, key: "B", label: "まずまず", color: "var(--g-b)" },
  { max: 10, key: "C", label: "ずれている", color: "var(--g-c)" },
  { max: 1000, key: "D", label: "大きくずれ", color: "var(--g-d)" }
];
const gradeOf = (err) => GRADES.find((g) => err <= g.max + 1e-9);

// ---------- 出題用のレンジ ----------
const TOP_LIST = [5, 8, 10, 12, 15, 20, 25, 30, 40, 50];
// 登録済みレンジ。直近に選んだものが先頭
function allPatterns() {
  return S.patterns.map((c) => { const sel = new Uint8Array(169); c.idx.forEach((i) => (sel[i] = 1)); return { id: c.id, name: c.name, sel, custom: true, used: c.used || 0 }; }).sort((a, b) => b.used - a.used);
}
function touchPattern(id) {
  const c = S.patterns.find((x) => x.id === id);
  if (c) { c.used = Date.now(); savePatterns(); }
}
const enabledPatterns = () => allPatterns().filter((x) => !S.offPatterns.includes(x.id));
function randomRange(kind) {
  const pats = enabledPatterns();
  const useTop = kind === "top" || !pats.length || (kind !== "shape" && Math.random() < 0.55);
  if (useTop) {
    const p = TOP_LIST[(Math.random() * TOP_LIST.length) | 0];
    return { label: `上位${p}%`, sel: topPercent(p), note: "強さ順(対ランダム)で上位" + p + "%" };
  }
  const pt = pats[(Math.random() * pats.length) | 0];
  return { label: pt.name, sel: pt.sel, note: "" };
}

// ---------- 状態 ----------
const S = {
  tab: "quiz",
  settings: Object.assign({ street: "pre", kind: "mix", hero: "all" }, store.get("eqt_settings", {})),
  sessions: store.get("eqt_sessions", []), cur: null, qview: "home", detailId: null, delSess: null,
  patterns: store.get("eqt_patterns", []), offPatterns: store.get("eqt_off", []), editor: null, delId: null,
  q: null, phase: "ask", guess: 50, res: null,
  calc: {
    A: { mode: "hand", cards: [null, null], sel: new Uint8Array(169), text: "", pats: [] },
    B: { mode: "range", cards: [null, null], sel: new Uint8Array(169), text: "", pats: [] },
    board: [null, null, null, null, null], out: null, busy: false, focus: null, err: { A: "", B: "" }
  }
};

// ---------- 共通UI ----------
function gridHtml(sel, opts = {}) {
  // opts: ro, heat(Float64Array|null, セルごとのeq or NaN), dead(Uint8Array of cell), focus
  let h = `<div class="grid ${opts.ro ? "ro" : ""}" ${opts.id ? `id="${opts.id}"` : ""}>`;
  for (let i = 0; i < 169; i++) {
    const on = sel[i];
    let style = "", cls = "cell", txt = CELLS[i].label;
    if (opts.heat) {
      const v = opts.heat[i];
      if (on && !Number.isNaN(v)) { cls += " hm"; style = heatStyle(v); txt = Math.round(v * 100); }
      else cls += " out";
      if (CELLS[i].kind === "p") cls += " pair";
    } else if (on) cls += " on";
    if (opts.focus === i) cls += " focus";
    h += `<div class="${cls}" data-i="${i}" ${style ? `style="${style}"` : ""}>${txt}</div>`;
  }
  h += "</div>";
  if (!opts.head) return h;
  const hd = (kind) => RL.split("").map((ch, i) => `<button class="gh" data-h${kind}="${opts.head}:${i}">${ch}</button>`).join("");
  return `<div class="gwrap"><span></span><div class="ghead gtop">${hd("c")}</div><div class="ghead gleft">${hd("r")}</div>${h}</div>`;
}
function showUndo(sel, before, side) {
  let u = $("#undo");
  if (u) u.remove();
  u = document.createElement("div"); u.id = "undo"; u.className = "undo";
  u.innerHTML = `<span>見出しで一括変更しました</span><button>元に戻す</button>`;
  document.body.appendChild(u);
  const t = setTimeout(() => u.remove(), 5000);
  u.querySelector("button").onclick = () => {
    clearTimeout(t); u.remove();
    sel.set(before);
    if (side !== "E") { S.calc[side].pats = []; S.calc.out = null; } else S.editor.top = 0;
    render();
  };
}
// 見出しタップ: 行X = XX と、そのXより弱い相手とのスーテッド / 列X = XX と、同じオフスーツ(Xより強いランクは含めない)
function toggleHeader(sel, kind, i) {
  const idx = [];
  for (let j = i; j < 13; j++) idx.push(kind === "r" ? i * 13 + j : j * 13 + i);
  const all = idx.every((x) => sel[x]);
  idx.forEach((x) => (sel[x] = all ? 0 : 1));
}
const HEAT_STOPS = [[0, "#5b7cff"], [0.25, "#5b7cff"], [0.5, "#5b6472"], [0.75, "#ffb02e"], [1, "#ffb02e"]];
const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function heatRgb(v) {
  const st = HEAT_STOPS;
  v = Math.max(0, Math.min(1, v));
  for (let i = 1; i < st.length; i++) {
    if (v <= st[i][0]) {
      const f = (v - st[i - 1][0]) / (st[i][0] - st[i - 1][0] || 1), a = hexRgb(st[i - 1][1]), b = hexRgb(st[i][1]);
      return a.map((x, k) => Math.round(x + (b[k] - x) * f));
    }
  }
  return hexRgb(st[st.length - 1][1]);
}
function heatStyle(v) { // 背景色と、読みやすい文字色
  const [r, g, b] = heatRgb(v);
  const lin = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  const cw = 1.05 / (L + 0.05), cb = (L + 0.05) / 0.0505; // 白文字 / ほぼ黒文字のコントラスト比
  return `background:rgb(${r},${g},${b});color:${cw >= cb ? "#fff" : "#010102"}`;
}
function heatFromBuckets(V, res) { // 相手コンボごとのeq → セルごとの平均(勝ち/引き分け/コンボ数つき)
  const { bEq, bWin, bTie } = res;
  const sum = new Float64Array(169), w = new Float64Array(169), t = new Float64Array(169), n = new Float64Array(169);
  V.forEach((c, i) => { if (Number.isNaN(bEq[i])) return; const ci = cellOfCombo(c[0], c[1]); sum[ci] += bEq[i]; w[ci] += bWin[i]; t[ci] += bTie[i]; n[ci]++; });
  const eq = Float64Array.from(sum, (x, i) => (n[i] ? x / n[i] : NaN));
  eq.win = Float64Array.from(w, (x, i) => (n[i] ? x / n[i] : NaN));
  eq.tie = Float64Array.from(t, (x, i) => (n[i] ? x / n[i] : NaN));
  eq.cnt = n;
  return eq;
}
function legendHtml() {
  const st = HEAT_STOPS;

  return `<div class="legend2"><span>不利 0%</span><span>五分 50%</span><span>有利 100%</span></div><div class="bar" style="background:linear-gradient(90deg,${grad})"></div>`;

function cellDetail(heat, i) {

}

function attachGridPaint(el, sel, onChange) {
  let paint = null, last = null;
  const cellAt = (x, y) => { const e = document.elementFromPoint(x, y); return e && e.dataset && e.dataset.i != null && el.contains(e) ? +e.dataset.i : null; };
  const loupe = (x, y, i) => {
    let lp = $("#loupe");
    if (i == null) { if (lp) lp.remove(); return; }
    if (!lp) { lp = document.createElement("div"); lp.id = "loupe"; lp.className = "loupe"; document.body.appendChild(lp); }
    lp.innerHTML = `<small>${paint ? "追加" : "解除"}</small>${CELLS[i].label}`;
    lp.style.left = Math.max(60, Math.min(window.innerWidth - 60, x)) + "px";
    lp.style.top = Math.max(60, y - 44) + "px";
  };
  const focus = (i) => {
    if (last != null && el.children[last]) el.children[last].classList.remove("focus");
    last = i;
    if (i != null) el.children[i].classList.add("focus");
  };
  const apply = (i) => { if (i != null && sel[i] !== paint) { sel[i] = paint; onChange(); el.children[i].classList.toggle("on", !!paint); } };
  el.addEventListener("pointerdown", (e) => {
    const i0 = cellAt(e.clientX, e.clientY);
    if (i0 == null) return;
    const touch = e.pointerType === "touch";
    let started = false, timer = null, sx = e.clientX, sy = e.clientY;
    const begin = (x, y) => {
      started = true;
      const i = cellAt(x, y) ?? i0;
      paint = sel[i] ? 0 : 1; apply(i); focus(i); loupe(x, y, i);
      if (touch && navigator.vibrate) navigator.vibrate(8);
    };
    const block = (ev) => { if (started && ev.cancelable) ev.preventDefault(); };
    const move = (ev) => {
      if (!started) {
        // タッチ: 長押し前に動いたらスクロールとみなして中止
        if (touch && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) end(true);
        return;
      }
      const j = cellAt(ev.clientX, ev.clientY); apply(j); focus(j); loupe(ev.clientX, ev.clientY, j == null ? last : j);
    };
    const end = (cancel) => {
      clearTimeout(timer);
      // タッチの短いタップは1セルだけ切り替え
      if (!started && touch && cancel !== true && !cancel?.type?.endsWith("cancel")) begin(sx, sy);
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", end); window.removeEventListener("pointercancel", end);
      el.removeEventListener("touchmove", block);
      focus(null); loupe(0, 0, null);
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", end); window.addEventListener("pointercancel", end);
    if (touch) { el.addEventListener("touchmove", block, { passive: false }); timer = setTimeout(() => begin(sx, sy), 220); }
    else { begin(e.clientX, e.clientY); e.preventDefault(); }
  });
}

function pickerSheet(disabled, current, label, onPick) {
  const sh = $("#sheet");
  let h = `<div class="sheet"><div><div class="row between" style="margin-bottom:10px"><b>${label}</b><button class="btn sm ghost" id="pkx">閉じる</button></div>`;
  for (let s = 0; s < 4; s++) {
    h += `<div class="pk">`;
    for (let r = 12; r >= 0; r--) {
      const id = r * 4 + s;
      h += `<button class="s${s} ${id === current ? "sel" : ""}" data-id="${id}" ${disabled.has(id) && id !== current ? "disabled" : ""}>${EQ.RK[r]}<br><span style="font-size:11px">${SUITCH[s]}</span></button>`;
    }
    h += `</div>`;
  }
  h += `<button class="btn sm ghost" id="pkc">この枠をクリア</button></div></div>`;
  sh.innerHTML = h;
  const close = () => (sh.innerHTML = "");
  sh.onclick = (e) => {

    const b = e.target.closest("button[data-id]");
    if (b && !b.disabled) { close(); onPick(+b.dataset.id); }
  };
}

// ---------- 出題 ----------
function heroPool() {
  const h = S.settings.hero;
  if (h.startsWith("pat:")) {
    const pt = allPatterns().find((x) => x.id === h.slice(4));
    if (pt) return rangeCombos(pt.sel);
  } else if (h !== "all") return rangeCombos(topPercent(+h));
  return null;
}
function heroLabel() {
  const h = S.settings.hero;
  if (h === "all") return "ランダム";
  if (h.startsWith("pat:")) { const pt = allPatterns().find((x) => x.id === h.slice(4)); return pt ? pt.name : "ランダム"; }
  return "上位" + h + "%";
}
function genQuestion() {
  for (;;) {
    let hero;
    const pool = heroPool();
    if (!pool) {
      const a = (Math.random() * 52) | 0;
      let b; do { b = (Math.random() * 52) | 0; } while (b === a);
      hero = [a, b];
    } else {
      hero = pool[(Math.random() * pool.length) | 0].slice();
      if (Math.random() < 0.5) hero.reverse();
    }
    let street = S.settings.street;
    if (street === "rand") street = ["pre", "flop", "turn", "river"][(Math.random() * 4) | 0];
    const nb = { pre: 0, flop: 3, turn: 4, river: 5 }[street];
    const used = new Set(hero), board = [];
    while (board.length < nb) { const c = (Math.random() * 52) | 0; if (!used.has(c)) { used.add(c); board.push(c); } }
    const rg = randomRange(S.settings.kind);
    const dead = new Uint8Array(52); used.forEach((c) => (dead[c] = 1));
    const V = rangeCombos(rg.sel, dead);
    if (V.length < 8) continue;
    return { hero, board, street, range: rg, V };
  }
}
function newQuestion() { S.q = genQuestion(); S.phase = "ask"; S.res = null; S.guess = 50; render(); }

function startSession() {
  S.cur = { id: Date.now(), t0: Date.now(), heroLabel: heroLabel(), settings: Object.assign({}, S.settings), items: [] };
  S.qview = "play";
  newQuestion(); window.scrollTo(0, 0);
}
function endSession() {
  if (S.cur && S.cur.items.length) {
    S.cur.t1 = Date.now();
    S.sessions.push(S.cur);
    store.set("eqt_sessions", S.sessions);
  }
  S.cur = null; store.set("eqt_cur", null);
  S.q = null; S.phase = "ask"; S.res = null; S.qview = "home";
  render(); window.scrollTo(0, 0);
}

async function submitGuess() {
  const cur = S.cur;
  S.phase = "calc"; render();
  const q = S.q, guess = S.guess;
  const r = await computeEquity([q.hero], q.V, q.board, { samples: 400000 });
  if (S.cur !== cur) return; // 計算中にセッションを終えた
  const actual = r.eq * 100, err = Math.abs(guess - actual);
  S.res = { r, actual, err, signed: guess - actual, grade: gradeOf(err), heat: heatFromBuckets(r.V, r) };
  cur.items.push({ t: Date.now(), hero: q.hero, board: q.board, label: q.range.label, street: q.street, guess, actual: +actual.toFixed(2) });
  store.set("eqt_cur", cur);
  S.phase = "result"; render();
}

const absErr = (x) => Math.abs(x.guess - x.actual);
const mean = (a) => a.reduce((s, v) => s + v, 0) / a.length;
function statsHtml(items, withDots) {
  if (!items.length) return `<div class="note">まだ回答がありません。1問答えると、ここに誤差がたまります。</div>`;
  const errs = items.map(absErr);
  const bias = mean(items.map((x) => x.guess - x.actual));
  const cnt = GRADES.map((g) => errs.filter((e) => gradeOf(e).key === g.key).length);
  return `<div class="panel">
    <div class="kv">
      <span>回答数</span><span>${items.length}問</span>
      <span>平均誤差</span><span>${mean(errs).toFixed(1)}pt</span>
      <span>見積もりの偏り</span><span>${bias >= 0 ? "+" : ""}${bias.toFixed(1)}pt ${Math.abs(bias) < 0.7 ? "(偏りなし)" : bias > 0 ? "(高めに見積もりがち)" : "(低めに見積もりがち)"}</span>
    </div>

    <div class="gbar" style="margin-top:6px">${GRADES.map((g, i) => `<div style="width:${(cnt[i] / items.length) * 100}%;background:${g.color}"></div>`).join("")}</div>
    <div class="gl">${GRADES.map((g, i) => `<span><i style="background:${g.color}"></i>${g.key} ${g.max > 100 ? "10pt超" : "≤" + g.max + "pt"} ${cnt[i]}</span>`).join("")}</div>
    ${withDots ? `<div class="small dim" style="margin-top:14px">1問ごとの評価(左が古い)</div><div class="dots" style="margin-top:6px">${items.map((x) => `<span class="dot" style="background:${gradeOf(absErr(x)).color}"></span>`).join("")}</div>` : ""}
  </div>`;
}

// ---------- 傾向の分析 ----------
let TIER = null;
function handTier(c) {
  if (!TIER) TIER = [[10, topPercent(10)], [30, topPercent(30)], [50, topPercent(50)]];
  const ci = cellOfCombo(c[0], c[1]);
  for (const [p, sel] of TIER) if (sel[ci]) return `上位${p}%のハンド`;
  return "下位50%のハンド";
}
function handKind(c) {
  if ((c[0] >> 2) === (c[1] >> 2)) return "ポケットペア";
  return (c[0] & 3) === (c[1] & 3) ? "スーテッド" : "オフスーツ";
}
function rangeBand(label) {
  const m = /^上位(\d+)%$/.exec(label);
  if (!m) return "パターン: " + label;
  const n = +m[1];
  return n <= 10 ? "狭いレンジ(上位10%以下)" : n <= 25 ? "中くらいのレンジ(上位11〜25%)" : "広いレンジ(上位26%以上)";
}
function eqBand(a) {
  return a < 30 ? "大きく劣勢(30%未満)" : a < 45 ? "やや劣勢(30〜45%)" : a < 55 ? "ほぼ互角(45〜55%)" : a < 70 ? "やや優勢(55〜70%)" : "大きく優勢(70%以上)";
}
const DIMS = [
  ["ストリート", (x) => STREET_LABEL[x.street]],
  ["自分のハンドの種類", (x) => handKind(x.hero)],
  ["自分のハンドの強さ", (x) => handTier(x.hero)],
  ["相手のレンジ", (x) => rangeBand(x.label)],
  ["実際のエクイティ", (x) => eqBand(x.actual)]
];
function groupStats(items, fn) {
  const m = new Map();
  for (const x of items) {
    const k = fn(x);
    const g = m.get(k) || { key: k, n: 0, abs: 0, sgn: 0 };
    g.n++; g.abs += absErr(x); g.sgn += x.guess - x.actual;
    m.set(k, g);
  }
  return [...m.values()].map((g) => ({ key: g.key, n: g.n, avg: g.abs / g.n, bias: g.sgn / g.n }));
}
const MIN_N = 3;
function biasText(b) { return Math.abs(b) < 1 ? "偏りなし" : b > 0 ? `高め+${b.toFixed(1)}` : `低め${b.toFixed(1)}`; }
function rowHtml(g) {
  const gr = gradeOf(g.avg);
  return `<div class="arow ${g.n < MIN_N ? "faint" : ""}"><div class="row between"><span>${g.key}</span><span class="dim small">${g.n}問</span></div>
    <div class="row" style="gap:10px"><div class="abar"><div style="width:${Math.min(100, (g.avg / 15) * 100)}%;background:${gr.color}"></div></div><span style="min-width:104px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px">${g.avg.toFixed(1)}pt <span class="dim">${biasText(g.bias)}</span></span></div></div>`;
}
function analysisHtml(items) {
  if (items.length < 5) return `<div class="panel"><div class="note">回答が5問以上たまると、ミスの傾向がここに出ます(今 ${items.length}問)。</div></div>`;
  const all = [];
  let sections = "";
  for (const [title, fn] of DIMS) {
    const gs = groupStats(items, fn);
    gs.forEach((g) => all.push({ dim: title, ...g }));
    gs.sort((a, b) => (b.n >= MIN_N) - (a.n >= MIN_N) || b.avg - a.avg);
    sections += `<h2>${title}</h2><div class="panel">${gs.map(rowHtml).join("")}</div>`;
  }
  const hs = groupStats(items, (x) => EQ.CELLS[cellOfCombo(x.hero[0], x.hero[1])].label).filter((g) => g.n >= 2).sort((a, b) => b.avg - a.avg).slice(0, 8);
  const worst = all.filter((g) => g.n >= MIN_N).sort((a, b) => b.avg - a.avg).slice(0, 3);
  let h = `<div class="panel"><div class="small dim" style="margin-bottom:8px">誤差が大きい状況(各${MIN_N}問以上)</div>`;
  h += worst.length ? worst.map((g, i) => `<div style="margin-bottom:10px"><div style="font-weight:700">${i + 1}. ${g.key} <span class="dim small" style="font-weight:400">(${g.dim})</span></div><div class="dim small">平均誤差 ${g.avg.toFixed(1)}pt・${g.n}問・${biasText(g.bias)}</div></div>`).join("") : `<div class="note">同じ状況が${MIN_N}問以上たまると表示されます。</div>`;
  h += `</div>` + sections;
  if (hs.length) h += `<h2>ハンド別(2問以上)</h2><div class="panel">${hs.map(rowHtml).join("")}</div>`;
  return h + `<div class="note">バーは平均誤差(15pt = 満杯)。「高め/低め」は予想が実際より高かったか低かったかの平均です。</div>`;
}

// ---------- 計算 ----------
function calcDead(excludeSide) {

}

  } else {

      <div class="small dim" style="margin:12px 0 8px">パターン(タップで追加、もう一度で削除)</div><div class="row wrap">${allPatterns().map((x) => `<button class="chip ${p.pats.includes(x.id) ? "on" : ""}" data-load="${side}:${x.id}">${x.name}</button>`).join("")}<button class="chip" id="edNew">+ 新規</button></div>${allPatterns().length ? "" : `<div class="note" style="margin-top:8px">まだ登録がありません。「この選択を登録」か「+ 新規」で追加できます。</div>`}`;
  }
  return h + `</div>`;
}
function calcHtml() {
  const c = S.calc;
  let h = ``;
  if (S.editor) return h + editorHtml();
  h += `<div class="panel"><div class="small dim" style="margin-bottom:8px">ボード(任意)</div><div class="cards">${c.board.map((x, i) => x == null ? `<button class="slot sm" data-pick="board:${i}">+</button>` : `<button class="slot sm" style="border:0;padding:0;background:none" data-pick="board:${i}">${cardHtml(x, true)}</button>`).join("")}</div></div>`;

        <div style="text-align:right"><div class="dim small">相手</div><div class="big" style="color:var(--dim)">${pct(1 - r.eq)}<small>%</small></div></div></div>
        <div class="bar2" style="margin-top:10px"><div style="width:${r.win * 100}%;background:var(--win)"></div><div style="width:${r.tie * 100}%;background:var(--tie)"></div><div style="width:${(1 - r.win - r.tie) * 100}%;background:var(--lose)"></div></div>
        <div class="gl" style="margin-top:6px"><span><i style="background:var(--win)"></i>勝ち ${pct(r.win)}%</span><span><i style="background:var(--tie)"></i>引き分け ${pct(r.tie)}%</span><span><i style="background:var(--lose)"></i>負け ${pct(1 - r.win - r.tie)}%</span></div>

        <div class="note faintnote">${r.exact ? "厳密(全通り)" : `誤差 ±${(r.se * 100 * 2).toFixed(2)}%`} ・ 相手レンジ ${o.vCount}コンボ${o.hCount > 1 ? ` ・ 自分 ${o.hCount}コンボ` : ""}</div></div>`;
      if (o.heat) h += `<div class="panel"><div class="small dim" style="margin-bottom:8px">vs 相手ハンド別エクイティ(%)</div>${gridHtml(o.sel, { ro: true, heat: o.heat })}${legendHtml()}<div class="note" id="cellInfo" style="margin-top:8px">${CELL_HINT}</div></div>`;

}
async function runCalc() {
  const c = S.calc;
  const bd = c.board.filter((x) => x != null);
  const dead = new Uint8Array(52); bd.forEach((x) => (dead[x] = 1));
  const sideCombos = (side) => {
    const p = c[side];
    if (p.mode === "hand") {
      if (p.cards.some((x) => x == null)) return { error: `${side === "A" ? "自分" : "相手"}のハンドを2枚選んでください` };
      return { list: [p.cards.slice()] };
    }
    const list = rangeCombos(p.sel);
    if (!list.length) return { error: `${side === "A" ? "自分" : "相手"}のレンジが空です` };
    return { list };
  };
  const A = sideCombos("A"), B = sideCombos("B");
  if (A.error || B.error) { c.out = { error: A.error || B.error }; return render(); }
  c.busy = true; render();
  await new Promise((r) => setTimeout(r, 30));
  const r = await computeEquity(A.list, B.list, bd, { samples: 300000 });
  c.busy = false;
  if (!r) c.out = { error: "ボード・ハンドが重なっていて、有効な組み合わせがありません" };
  else {
    const single = A.list.length === 1 && c.B.mode === "range";
    c.out = { r, vCount: r.V.length, hCount: A.list.length, heat: single ? heatFromBuckets(r.V, r) : null, sel: single ? Uint8Array.from(c.B.sel) : null };
  }
  render();
  const rp = $("#calcres"); if (rp) rp.scrollIntoView({ behavior: "smooth", block: "start" });
}

// カード選択: 空いている次の枠があれば、閉じずに続けて選ばせる
function openPicker(side, i) {
  const arr = side === "board" ? S.calc.board : S.calc[side].cards;
  const dis = calcDead(side === "board" ? null : side);
  arr.forEach((x, j) => { if (j !== i && x != null) dis.add(x); });
  if (side !== "board") S.calc.board.forEach((x) => x != null && dis.add(x));
  const label = side === "board" ? `ボード ${i + 1}枚目を選ぶ` : `${side === "A" ? "自分" : "相手"}のハンド ${i + 1}枚目を選ぶ`;
  pickerSheet(dis, arr[i], label, (id) => {
    arr[i] = id; S.calc.out = null; render();
    if (id != null && i + 1 < arr.length && arr[i + 1] == null) openPicker(side, i + 1);
  });
}

const savePatterns = () => { store.set("eqt_patterns", S.patterns); store.set("eqt_off", S.offPatterns); };

// 見出し(A〜2): 誤タップ防止のため長押し(0.4秒)で一括変更
document.addEventListener("contextmenu", (e) => { if (e.target.closest("[data-hr],[data-hc]")) e.preventDefault(); });
document.addEventListener("pointerdown", (e) => {
  const hh = e.target.closest("[data-hr],[data-hc]");
  if (!hh) return;
  const sx = e.clientX, sy = e.clientY;
  hh.classList.add("hold");
  const stop = () => { clearTimeout(timer); hh.classList.remove("hold"); window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", stop); window.removeEventListener("pointercancel", stop); };
  const mv = (ev) => { if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) stop(); };
  const timer = setTimeout(() => {
    stop();
    if (navigator.vibrate) navigator.vibrate(12);
    const kind = hh.dataset.hr != null ? "r" : "c", [side, i] = (hh.dataset.hr != null ? hh.dataset.hr : hh.dataset.hc).split(":");
    const sel = side === "E" ? S.editor.sel : S.calc[side].sel;
    const before = Uint8Array.from(sel);

    if (side !== "E") { S.calc[side].pats = []; S.calc.out = null; } else S.editor.top = 0;
    render();
    showUndo(sel, before, side);
  }, 400);
  window.addEventListener("pointermove", mv); window.addEventListener("pointerup", stop); window.addEventListener("pointercancel", stop);
});

document.addEventListener("click", (e) => {
  const t = e.target;
  const tab = t.closest(".tabs button");
  if (tab) { S.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }

    const i = +cell.dataset.i, info = $("#cellInfo");
    const heat = S.tab === "quiz" ? (S.res && S.res.heat) : (S.calc.out && S.calc.out.heat);
    if (info && heat && !Number.isNaN(heat[i])) info.textContent = cellDetail(heat, i);
    return;
  }
  if (t.closest("[data-hr],[data-hc]")) return; // 見出しは長押しで一括変更(下のpointerdown)
  // パターン別レンジ
  if (t.closest("#edNew")) { S.editor = { name: "", sel: new Uint8Array(169), text: "", err: "", msg: "" }; render(); window.scrollTo(0, 0); return; }

    if (idx.length < 1 || countCombos(e.sel) < 8) { e.msg = "レンジが小さすぎます(8コンボ以上選んでください)"; render(); return; }

    render(); return;
  }
  const pt = t.closest("[data-pat]");

  const pd = t.closest("[data-patdel]");

    const id = pd.dataset.patdel;
    if (S.delId !== id) { S.delId = id; render(); return; }
    S.patterns = S.patterns.filter((x) => x.id !== id); S.offPatterns = S.offPatterns.filter((x) => x !== id); S.delId = null; savePatterns(); render(); return;
  }
  const rg = t.closest("[data-reg]");
  if (rg) { S.editor = { name: "", sel: Uint8Array.from(S.calc[rg.dataset.reg].sel), text: "", err: "", msg: "" }; render(); window.scrollTo(0, 0); return; }
  const ld = t.closest("[data-load]");
  if (ld) {

    if (pt2) {
      touchPattern(id);
      const pc = S.calc[side], sel = pc.sel;
      if (pc.pats.includes(pt2.id)) {
        pc.pats = pc.pats.filter((x) => x !== pt2.id);
        const keep = new Uint8Array(169);
        allPatterns().forEach((o) => { if (pc.pats.includes(o.id)) o.sel.forEach((v, i) => v && (keep[i] = 1)); });
        pt2.sel.forEach((v, i) => { if (v && !keep[i]) sel[i] = 0; });
      } else { pc.pats.push(pt2.id); pt2.sel.forEach((v, i) => v && (sel[i] = 1)); }
      S.calc.out = null; render();

    S.sessions = S.sessions.filter((x) => x !== sid); store.set("eqt_sessions", S.sessions); S.delSess = null; S.qview = "history"; render(); window.scrollTo(0, 0); return;
  }
  if (t.closest("#submit")) return submitGuess();

  // 電卓
  const mode = t.closest("[data-mode]");
  if (mode) { S.calc[mode.dataset.side].mode = mode.dataset.mode; S.calc.out = null; render(); return; }
  const pick = t.closest("[data-pick]");
  if (pick) { const [side, idx] = pick.dataset.pick.split(":"); openPicker(side, +idx); return; }
  const ad = t.closest("[data-add]");
  if (ad) { const [side, txt] = ad.dataset.add.split(":"); addRange(S.calc[side].sel, txt); S.calc.out = null; render(); return; }
  const top = t.closest("[data-top]");
  if (top) { const [side, p] = top.dataset.top.split(":"); S.calc[side].top = +p; S.calc[side].sel = topPercent(+p); S.calc[side].pats = []; S.calc[side].text = ""; S.calc.err[side] = ""; S.calc.out = null; render(); return; }
  const cl = t.closest("[data-clear]");
  if (cl) { S.calc[cl.dataset.clear].sel = new Uint8Array(169); S.calc[cl.dataset.clear].pats = []; S.calc[cl.dataset.clear].top = 0; S.calc[cl.dataset.clear].text = ""; S.calc.out = null; render(); return; }
  const al = t.closest("[data-all]");
  if (al) { S.calc[al.dataset.all].sel = new Uint8Array(169).fill(1); S.calc[al.dataset.all].pats = []; S.calc.out = null; render(); return; }
  if (t.closest("#go")) return runCalc();
});
document.addEventListener("input", (e) => {
  if (e.target.id === "edName") { S.editor.name = e.target.value; return; }
  if (e.target.id && e.target.id.startsWith("ctop")) {
    const side = e.target.id.slice(4), v = +e.target.value, pc = S.calc[side];
    pc.top = v; pc.sel = topPercent(v); pc.pats = []; S.calc.out = null;
    $("#ctV" + side).textContent = v ? "上位 " + v + "%" : "0%";
    const g = $("#g" + side);
    if (g) for (let i = 0; i < 169; i++) g.children[i].classList.toggle("on", !!pc.sel[i]);
    $("#grid" + side).previousElementSibling.textContent = `タップ・なぞって選択:${comboLabel(countCombos(pc.sel))}`;
    return;
  }
  if (e.target.id === "edTop") {
    const v = +e.target.value, ed = S.editor;
    ed.top = v; ed.sel = topPercent(v);
    $("#edTopV").textContent = v ? "上位 " + v + "%" : "0%";
    const g = $("#gE");
    if (g) for (let i = 0; i < 169; i++) g.children[i].classList.toggle("on", !!ed.sel[i]);
    $("#edCount").textContent = `タップ・なぞって選択:${comboLabel(countCombos(ed.sel))}`;
    return;
  }
  if (e.target.id === "gs") { S.guess = +e.target.value; $("#gv").textContent = S.guess; }
});


(function migrate() {
  const old = store.get("eqt_history", []);
  if (old.length) {
    S.sessions.unshift({ id: old[0].t, t0: old[0].t, t1: old[old.length - 1].t, heroLabel: "以前の記録", settings: {}, items: old });
    try { localStorage.removeItem("eqt_history"); } catch (e) {}
  }
  const cur = store.get("eqt_cur", null);
  if (cur && cur.items && cur.items.length) { cur.t1 = cur.items[cur.items.length - 1].t; S.sessions.push(cur); }
  store.set("eqt_cur", null);
  if (old.length || (cur && cur.items)) store.set("eqt_sessions", S.sessions);
})();
render();
</script>
